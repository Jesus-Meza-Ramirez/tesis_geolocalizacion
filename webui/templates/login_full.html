{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <style>
    html, body { height:100%; width:100%; margin:0; }
    body { background:#0f1e25; }
    .login-wrapper { display:flex; min-height:100vh; width:100vw; }
    .login-left  { flex:1.2; background:url("{% static 'img/Imagen2.png' %}") center/cover no-repeat; }
    .login-right { flex:0.8; background:#ffffff; display:flex; align-items:center; justify-content:center; padding:48px 24px; }
    .form-card {
    width:100%;
    max-width:500px;
    background:#ffffff;
    border-radius:24px;
    padding:32px;
    color:#1f2937;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    } 
    .logo { text-align:center; margin-bottom:10px; }
    .logo img { width:180px; }
    .welcome { font-size:28px; color:#1f2937; font-weight:800; margin:6px 0 18px; }
    label { display:block; font-size:14px; margin-bottom:6px; color:#374151; }
    input { width:100%; padding:11px 12px; border:none; border-radius:8px; margin-bottom:14px; outline:none; font-size:15px; background:#eef2f5; color:#0b1720; }
    .forgot { text-align:right; font-size:13px; margin:-6px 0 14px; }
    .forgot a { color:#f7941d; text-decoration:none; }
    .btn-login { width:100%; background:#f59e0b; border:none; color:#fff; padding:12px; font-weight:700; border-radius:10px; cursor:pointer; }
    @media (max-width:900px){ .login-left{display:none;} .login-right{flex:1;} .form-card{max-width:500px;} }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-left"></div>
    <div class="login-right">
      <div class="form-card">
        <div class="logo"><img src="{% static 'img/logo_necomplus.jpg' %}" alt="NECOMPLUS"></div>
        <div class="welcome">Bienvenido</div>
        <form method="POST" autocomplete="off">
            {% csrf_token %}

            <label for="usuario">Usuario</label>
            <input id="usuario"
                  name="usuario"
                  type="text"
                  placeholder="Ingresa tu usuario"
                  required
                  autocomplete="off"
                  autocapitalize="none"
                  spellcheck="false">

            <label for="contrasena">Contraseña</label>
            <input id="contrasena"
                  name="contrasena"
                  type="password"
                  placeholder="Ingresa tu contraseña"
                  required
                  autocomplete="new-password">

            <div class="forgot"><a href="#">¿Has olvidado tu contraseña?</a></div>
            <button class="btn-login" type="submit">Iniciar sesión</button>
        </form>

      </div>
    </div>
  </div>
</body>
</html>
