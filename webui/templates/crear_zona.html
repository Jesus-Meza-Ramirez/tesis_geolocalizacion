{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Zona</title>

  <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=31">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css">

  <style>
    #map {
      width: 100%;
      height: 560px;
      border-radius: 12px;
      border: 1px solid #ddd;
      margin-top: 14px;
    }

    .zona-card {
      background: #fff;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-top: 18px;
    }

    .zona-card label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }

    .zona-card input,
    .zona-card select {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .btn-zone {
      background: #f28c13;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-back {
      background: #991b1b;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      margin-left: 8px;
      font-weight: 600;
    }

    .zona-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
  </style>
</head>

<body>
<div class="layout">

  <aside class="sidebar">
    <div class="brand">NECOMPLUS</div>
    <ul class="menu">
      <li><a href="{% url 'panel_admin_sistema' %}">Panel Principal</a></li>
      <li><a href="{% url 'panel_boleteros' %}">Gestión de Técnicos</a></li>
      <li><a href="{% url 'panel_zonas' %}">Gestión de Zonas</a></li>
      <li><a href="{% url 'panel_ordenes_admin' %}">Órdenes</a></li>
      <li><a href="{% url 'logout' %}">Cerrar sesión</a></li>
    </ul>
  </aside>

  <section class="main">
    <div class="title-strip">Creación de zonas</div>
    <button class="hamburger" id="btnMenu">☰</button>
    <p class="hello">Administrador del sistema — Crear nueva zona</p>

    <div class="zona-card">
      <label>Nombre de la zona</label>
      <input type="text" id="nombreZona" placeholder="Ejemplo: Zona Villa María">

      <label>Método de creación</label>
      <select id="metodoZona" onchange="cambiarMetodo()">
        <option value="manual">Dibujar manualmente</option>
        <option value="distrito">Cargar distrito</option>
      </select>

      <div id="panelDistrito" style="display:none;">
        <label>Distrito</label>
        <select id="selectDistrito">
          <option value="">Cargando distritos...</option>
        </select>

        <button type="button" class="btn-zone" onclick="cargarDistrito()">
          Cargar distrito
        </button>
      </div>

      <br><br>

      <button type="button" class="btn-zone" id="btnGuardarZona" onclick="guardarZona()">
        Guardar zona
      </button>

      <a href="{% url 'panel_zonas' %}" class="btn-back">
        Volver
      </a>

      <div id="map"></div>
    </div>
  </section>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>

<script>
let mapa;
let drawnItems;
let coordenadasZona = [];
let distritosGeoJSON = null;

document.addEventListener("DOMContentLoaded", function () {
  mapa = L.map("map").setView([-12.0464, -77.0428], 11);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(mapa);

  drawnItems = new L.FeatureGroup();
  mapa.addLayer(drawnItems);

  const drawControl = new L.Control.Draw({
    draw: {
      polygon: true,
      rectangle: false,
      circle: false,
      marker: false,
      polyline: false,
      circlemarker: false
    },
    edit: {
      featureGroup: drawnItems,
      remove: true
    }
  });

  mapa.addControl(drawControl);

  mapa.on(L.Draw.Event.CREATED, function (event) {
    drawnItems.clearLayers();

    const layer = event.layer;
    drawnItems.addLayer(layer);

    extraerCoordenadas(layer);
  });

  mapa.on(L.Draw.Event.EDITED, function (event) {
    event.layers.eachLayer(function (layer) {
      extraerCoordenadas(layer);
    });
  });

  mapa.on(L.Draw.Event.DELETED, function () {
    coordenadasZona = [];
  });

  cargarGeoJSONDistritos();
});

function cambiarMetodo() {
  const metodo = document.getElementById("metodoZona").value;
  const panelDistrito = document.getElementById("panelDistrito");

  if (metodo === "distrito") {
    panelDistrito.style.display = "block";
  } else {
    panelDistrito.style.display = "none";
  }
}

function cargarGeoJSONDistritos() {
  fetch("{% static 'geo/lima_callao_distritos.geojson' %}")
    .then(response => response.json())
    .then(data => {
      distritosGeoJSON = data;

      const select = document.getElementById("selectDistrito");
      select.innerHTML = '<option value="">Seleccione un distrito</option>';

      data.features.forEach(function(feature, index) {
        const nombreDistrito =
          feature.properties.distrito ||
          feature.properties.DISTRITO ||
          feature.properties.name ||
          feature.properties.NOMBRE ||
          "Distrito " + index;

        const option = document.createElement("option");
        option.value = index;
        option.textContent = nombreDistrito;
        select.appendChild(option);
      });
    })
    .catch(error => {
      console.error(error);
      alert("No se pudo cargar el archivo de distritos.");
    });
}

function cargarDistrito() {
  const select = document.getElementById("selectDistrito");
  const index = select.value;

  if (!index) {
    alert("Seleccione un distrito.");
    return;
  }

  const feature = distritosGeoJSON.features[index];

  drawnItems.clearLayers();
  coordenadasZona = [];

  const latlngs = convertirFeatureALatLngs(feature);

  if (latlngs.length < 3) {
    alert("No se pudo cargar el contorno del distrito.");
    return;
  }

  const polygon = L.polygon(latlngs, {
    color: "#f59e0b",
    weight: 3
  });

  drawnItems.addLayer(polygon);
  mapa.fitBounds(polygon.getBounds());

  extraerCoordenadas(polygon);
}

function convertirFeatureALatLngs(feature) {
  const geometry = feature.geometry;

  let mejorPoligono = [];

  if (geometry.type === "Polygon") {
    mejorPoligono = geometry.coordinates[0];
  }

  if (geometry.type === "MultiPolygon") {
    geometry.coordinates.forEach(function(poligono) {
      const anillo = poligono[0];

      if (anillo.length > mejorPoligono.length) {
        mejorPoligono = anillo;
      }
    });
  }

  return mejorPoligono.map(function(coord) {
    return [coord[1], coord[0]];
  });
}


function extraerCoordenadas(layer) {
  coordenadasZona = [];

  const latlngs = layer.getLatLngs()[0];

  latlngs.forEach(function (punto, index) {
    coordenadasZona.push({
      latitud: punto.lat,
      longitud: punto.lng,
      orden: index + 1
    });
  });
}

function guardarZona() {
  const nombreZona = document.getElementById("nombreZona").value.trim();
  const btnGuardar = document.getElementById("btnGuardarZona");

  if (!nombreZona) {
    alert("Ingrese el nombre de la zona.");
    return;
  }

  if (!coordenadasZona || coordenadasZona.length < 3) {
    alert("Debe dibujar o cargar una zona con al menos 3 puntos.");
    return;
  }

  btnGuardar.disabled = true;
  btnGuardar.textContent = "Guardando...";

  fetch("{% url 'guardar_zona' %}", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": "{{ csrf_token }}"
    },
    body: JSON.stringify({
      nombre_zona: nombreZona,
      coordenadas: coordenadasZona
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.ok) {
      alert("Zona guardada correctamente.");
      window.location.href = "{% url 'panel_zonas' %}";
    } else {
      alert(data.error || "Error al guardar la zona.");
      btnGuardar.disabled = false;
      btnGuardar.textContent = "Guardar zona";
    }
  })
  .catch(error => {
    console.error(error);
    alert("Error de conexión.");
    btnGuardar.disabled = false;
    btnGuardar.textContent = "Guardar zona";
  });
}
</script>
<script>
const btnMenu = document.getElementById('btnMenu');
const sidebar = document.querySelector('.sidebar');

if (btnMenu && sidebar) {
  btnMenu.addEventListener('click', () => {
    sidebar.classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    if (!sidebar.contains(e.target) && !btnMenu.contains(e.target)) {
      sidebar.classList.remove('open');
    }
  });
}
</script>
</body>
</html>
