{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Asignar zona</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=31">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css">

  <style>
    #map {
      width: 100%;
      height: 540px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    .zona-form {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .zona-form input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin: 6px 0 12px;
    }
  </style>
</head>

<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">NECOMPLUS</div>
    <ul class="menu">
      <li><a href="{% url 'panel_admin_sistema' %}">Panel Principal</a></li>
      <li><a href="{% url 'panel_boleteros' %}">Gestión de Técnicos</a></li>
      <li><a href="{% url 'logout' %}">Cerrar sesión</a></li>
    </ul>
  </aside>

  <section class="main">
    <div class="title-strip">Asignar zona del técnico</div>

    <p class="hello">
      Técnico: <strong>{{ tecnico.id_usuario.nombre }}</strong>
    </p>

    <div class="zona-form">
      <label>Nombre de la zona</label>
      <input
        type="text"
        id="nombreZona"
        value="{{ zona.nombre_zona|default:'' }}"
        placeholder="Ejemplo: Zona Lima Centro"
      >

      <button type="button" class="btn btn-add" onclick="guardarZona()">
        Guardar zona
      </button>

      <a href="{% url 'panel_boleteros' %}" class="btn btn-del">
        Volver
      </a>
    </div>

    <div id="map"></div>
  </section>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>

<script>
  let map;
  let drawnItems;
  let coordenadas = [];

  document.addEventListener("DOMContentLoaded", function () {
    map = L.map("map").setView([-12.0464, -77.0428], 12);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const zonaExistente = {{ coordenadas_zona|safe }};

    if (zonaExistente.length > 0) {
      const polygon = L.polygon(zonaExistente, {
        color: "#f59e0b",
        weight: 3
      });

      drawnItems.addLayer(polygon);
      map.fitBounds(polygon.getBounds());

      coordenadas = zonaExistente.map(function (punto, index) {
        return {
          latitud: punto[0],
          longitud: punto[1],
          orden: index + 1
        };
      });
    }

    const drawControl = new L.Control.Draw({
      draw: {
        polygon: true,
        rectangle: false,
        circle: false,
        circlemarker: false,
        marker: false,
        polyline: false
      },
      edit: {
        featureGroup: drawnItems,
        remove: true
      }
    });

    map.addControl(drawControl);

    map.on(L.Draw.Event.CREATED, function (event) {
      drawnItems.clearLayers();

      const layer = event.layer;
      drawnItems.addLayer(layer);

      extraerCoordenadas(layer);
    });

    map.on(L.Draw.Event.EDITED, function (event) {
      event.layers.eachLayer(function (layer) {
        extraerCoordenadas(layer);
      });
    });

    map.on(L.Draw.Event.DELETED, function () {
      coordenadas = [];
    });
  });

  function extraerCoordenadas(layer) {
    coordenadas = [];

    const latlngs = layer.getLatLngs()[0];

    latlngs.forEach(function (punto, index) {
      coordenadas.push({
        latitud: punto.lat,
        longitud: punto.lng,
        orden: index + 1
      });
    });

    console.log("Coordenadas actuales:", coordenadas);
  }

  function guardarZona() {
    const nombreZona = document.getElementById("nombreZona").value.trim();

    if (!nombreZona) {
      alert("Ingrese el nombre de la zona.");
      return;
    }

    if (coordenadas.length < 3) {
      alert("Debe dibujar una zona con al menos 3 puntos.");
      return;
    }

    fetch("{% url 'guardar_zona_tecnico' tecnico.id_tecnico %}", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ csrf_token }}"
      },
      body: JSON.stringify({
        nombre_zona: nombreZona,
        coordenadas: coordenadas
      })
    })
    .then(response => response.json())
    .then(data => {
      if (data.ok) {
        alert("Zona guardada correctamente.");
        window.location.href = "{% url 'panel_boleteros' %}";
      } else {
        alert(data.error || "Error al guardar la zona.");
      }
    })
    .catch(error => {
      console.error(error);
      alert("Error de conexión.");
    });
  }
</script>

</body>
</html>
