{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Editar Zona</title>

  <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=2">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css">

  <style>
    #map {
      width: 100%;
      height: 560px;
      border-radius: 12px;
      border: 1px solid #ddd;
      margin-top: 14px;
    }

    .zona-card {
      background: #fff;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-top: 18px;
    }

    .zona-card label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }

    .zona-card input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .btn-zone {
      background: #f28c13;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-back {
      background: #991b1b;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      margin-left: 8px;
      font-weight: 600;
    }
  </style>
</head>

<body>
<div class="layout">

  <aside class="sidebar">
    <div class="brand">NECOMPLUS</div>
    <ul class="menu">
      <li><a href="{% url 'panel_admin_sistema' %}">Panel Principal</a></li>
      <li><a href="{% url 'panel_boleteros' %}">Gestión de Técnicos</a></li>
      <li><a href="{% url 'panel_zonas' %}">Gestión de Zonas</a></li>
      <li><a href="{% url 'panel_incidencias' %}">Órdenes</a></li>
      <li><a href="{% url 'logout' %}">Cerrar sesión</a></li>
    </ul>
  </aside>

  <section class="main">
    <div class="title-strip">Sistema de Gestión de Técnicos con Geolocalización</div>

    <p class="hello">Administrador del sistema — Editar zona</p>

    <div class="zona-card">
      <label>Nombre de la zona</label>
      <input type="text" id="nombreZona" value="{{ zona.nombre_zona }}">

      <button type="button" class="btn-zone" onclick="actualizarZona()">
        Guardar cambios
      </button>

      <a href="{% url 'panel_zonas' %}" class="btn-back">
        Volver
      </a>

      <div id="map"></div>
    </div>
  </section>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>

<script>
let mapa;
let drawnItems;
let coordenadasZona = [];

const zonaExistente = {{ coordenadas_zona|safe }};

document.addEventListener("DOMContentLoaded", function () {
  mapa = L.map("map").setView([-12.0464, -77.0428], 12);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(mapa);

  drawnItems = new L.FeatureGroup();
  mapa.addLayer(drawnItems);

  if (zonaExistente.length > 0) {
    const polygon = L.polygon(zonaExistente, {
      color: "#f59e0b",
      weight: 3
    });

    drawnItems.addLayer(polygon);
    mapa.fitBounds(polygon.getBounds());

    coordenadasZona = zonaExistente.map(function (punto, index) {
      return {
        latitud: punto[0],
        longitud: punto[1],
        orden: index + 1
      };
    });
  }

  const drawControl = new L.Control.Draw({
    draw: {
      polygon: true,
      rectangle: false,
      circle: false,
      marker: false,
      polyline: false,
      circlemarker: false
    },
    edit: {
      featureGroup: drawnItems,
      remove: true
    }
  });

  mapa.addControl(drawControl);

  mapa.on(L.Draw.Event.CREATED, function (event) {
    drawnItems.clearLayers();

    const layer = event.layer;
    drawnItems.addLayer(layer);

    extraerCoordenadas(layer);
  });

  mapa.on(L.Draw.Event.EDITED, function (event) {
    event.layers.eachLayer(function (layer) {
      extraerCoordenadas(layer);
    });
  });

  mapa.on(L.Draw.Event.DELETED, function () {
    coordenadasZona = [];
  });
});

function extraerCoordenadas(layer) {
  coordenadasZona = [];

  const latlngs = layer.getLatLngs()[0];

  latlngs.forEach(function (punto, index) {
    coordenadasZona.push({
      latitud: punto.lat,
      longitud: punto.lng,
      orden: index + 1
    });
  });
}

function actualizarZona() {
  const nombreZona = document.getElementById("nombreZona").value.trim();

  if (!nombreZona) {
    alert("Ingrese el nombre de la zona.");
    return;
  }

  if (coordenadasZona.length < 3) {
    alert("Debe dibujar una zona con al menos 3 puntos.");
    return;
  }

  fetch("{% url 'actualizar_zona' zona.id_zona %}", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": "{{ csrf_token }}"
    },
    body: JSON.stringify({
      nombre_zona: nombreZona,
      coordenadas: coordenadasZona
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.ok) {
      alert("Zona actualizada correctamente.");
      window.location.href = "{% url 'panel_zonas' %}";
    } else {
      alert(data.error || "Error al actualizar la zona.");
    }
  })
  .catch(error => {
    console.error(error);
    alert("Error de conexión.");
  });
}
</script>

</body>
</html>
